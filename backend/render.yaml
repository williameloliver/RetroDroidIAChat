services:
  - type: web
    name: retroai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_SHARED_KEY
        sync: false
      - key: APP_URL
        value: https://retroai-backend.onrender.com
